services:
  - type: web
    name: bioverse-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build --workspace=packages/shared && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace=apps/api
    startCommand: NODE_ENV=production npm run db:deploy --workspace=apps/api && NODE_ENV=production npm run start --workspace=apps/api
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: TEACHER_ALLOWLIST_EMAILS
        sync: false
