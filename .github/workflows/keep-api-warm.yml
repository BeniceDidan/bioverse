name: Keep API warm

# Pings the Render API's health endpoint every 10 minutes during typical
# Indonesian school/study hours (06:00-23:00 WIB = 23:00-15:59 UTC) so the
# free-tier instance rarely goes to sleep while people are actually using
# the site. Free on GitHub Actions for public repos.

on:
  schedule:
    - cron: "*/10 23 * * *"
    - cron: "*/10 0-15 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: curl -sS --max-time 90 https://bioverse-api.onrender.com/api/health
